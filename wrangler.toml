name = "appvault"
compatibility_date = "2026-09-22"
pages_build_output_dir = "./public"

[[d1_databases]]
binding = "DB"
database_name = "appvault-db"
database_id = "fd75822f-3b37-412d-b540-53331a29d87b"

[[r2_buckets]]
binding = "APPS_BUCKET"
bucket_name = "appvault-files"

# Environment secrets/variables:
#   ADMIN_EMAIL
#   ADMIN_PASSWORD
#   SESSION_SECRET
#
# Keep passwords, API tokens and session secrets out of GitHub.
